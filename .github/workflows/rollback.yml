name: Rollback Deployment

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version/tag to rollback to (e.g., commit SHA)'
        required: true
        type: string

jobs:
  rollback:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Rollback on VPS
      uses: appleboy/ssh-action@v1.2.4
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          DEPLOY_DIR="${DEPLOY_DIR:-/opt/kidsgptbackend}"
          if [ ! -d "$DEPLOY_DIR" ]; then
            DEPLOY_DIR="$HOME/kidsgptbackend"
          fi
          if [ ! -d "$DEPLOY_DIR" ]; then
            DEPLOY_DIR="."
          fi
          cd "$DEPLOY_DIR" || exit 1
          
          VERSION="${{ inputs.version }}"
          
          if [ -f .env ]; then
            if grep -q "^APP_TAG=" .env; then
              sed "s|^APP_TAG=.*|APP_TAG=$VERSION|" .env > .env.tmp && mv .env.tmp .env
            else
              echo "APP_TAG=$VERSION" >> .env
            fi
          else
            exit 1
          fi
          
          if [ -f docker-compose.yml ]; then
            docker compose -f docker-compose.yml pull app
            APP_TAG=$VERSION docker compose -f docker-compose.yml up -d --no-deps app
          else
            COMPOSE_FILE=$(find . -name "docker-compose.yml" -type f 2>/dev/null | head -1)
            if [ -n "$COMPOSE_FILE" ]; then
              docker compose -f "$COMPOSE_FILE" pull app
              APP_TAG=$VERSION docker compose -f "$COMPOSE_FILE" up -d --no-deps app
            else
              exit 1
            fi
          fi
    
    - name: Verify rollback
      env:
        VPS_HOST: ${{ secrets.VPS_HOST }}
        HEALTH_CHECK_URL: ${{ secrets.VPS_HEALTH_CHECK_URL }}
      run: |
        # Set health check URL if not provided
        if [ -z "$HEALTH_CHECK_URL" ]; then
          HEALTH_CHECK_URL="https://${VPS_HOST}/api/v1/system/status"
        fi
        
                MAX_RETRIES=6
                RETRY_COUNT=0
                
                while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
                  HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$HEALTH_CHECK_URL" || echo "000")
                  
                  if [ "$HTTP_CODE" = "200" ]; then
                    RESPONSE=$(curl -s --max-time 10 "$HEALTH_CHECK_URL" || echo "")
                    if echo "$RESPONSE" | grep -q '"overall":"UP"'; then
                      echo "✅ Rollback verification successful"
                      exit 0
                    fi
                  fi
                  
                  RETRY_COUNT=$((RETRY_COUNT + 1))
                  if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                    sleep 10
                  fi
                done
                
                echo "⚠️ Rollback verification pending"
        
        echo "## 🔄 Rollback Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Rolled back to:** ${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Timestamp:** $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
        echo "- **Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Verification:** $([ "$HTTP_CODE" = "200" ] && echo "✅ Success" || echo "⚠️ Pending")" >> $GITHUB_STEP_SUMMARY

