name: Deploy to VPS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy (default: current branch)'
        required: false
        default: ''

# Prevent concurrent deployments
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false  # Don't cancel, wait for current to finish

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Initialize deployment tracking
      id: init
      run: |
        DEPLOYMENT_START=$(date +%s)
        echo "deployment_start=$DEPLOYMENT_START" >> $GITHUB_OUTPUT
        echo "Deployment tracking initialized at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
    
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.branch || github.ref }}
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_PASS }}
        
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USER }}/kidsgptbackend:${{ github.sha }}
        
    - name: Get previous deployment version
      id: previous_version
      uses: appleboy/ssh-action@v1.2.4
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          # Get current running image tag (if exists) - using POSIX-compliant approach
          PREVIOUS_TAG=$(docker ps --filter "name=backend" --format "{{.Image}}" | sed -n 's/.*kidsgptbackend:\(.*\)/\1/p' || echo "")
          if [ -z "$PREVIOUS_TAG" ]; then
            # Try to get from docker-compose or .env
            if [ -f .env ]; then
              PREVIOUS_TAG=$(grep '^APP_TAG=' .env 2>/dev/null | cut -d'=' -f2- || echo "")
            fi
          fi
          # Store in file for later use
          echo "$PREVIOUS_TAG" > /tmp/previous_tag.txt
          echo "Previous version: $PREVIOUS_TAG"
          echo "PREVIOUS_TAG=$PREVIOUS_TAG"
    
    - name: Deploy to VPS
      id: deploy
      uses: appleboy/ssh-action@v1.2.4
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
                  cat > .env << EOF
          # Database Configuration
          DB_URL=${{ secrets.DB_URL }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          
          # JWT Configuration
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          
          # OpenAI Configuration
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          
          # Email Configuration
          MAIL_HOST=${{ secrets.MAIL_HOST }}
          MAIL_PORT=${{ secrets.MAIL_PORT }}
          MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM=${{ secrets.MAIL_FROM }}
          MAIL_ENABLED=${{ secrets.MAIL_ENABLED }}
          
          # Frontend URL
          FRONTEND_URL=${{ secrets.FRONTEND_URL }}
          
          # Docker Configuration
          MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_USER=${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
          DOCKER_USER=${{ secrets.DOCKER_USER }}
          APP_TAG=${{ github.sha }}
          EOF
          
          if [ -f /tmp/previous_tag.txt ]; then
            PREVIOUS_TAG=$(cat /tmp/previous_tag.txt)
            echo "PREVIOUS_TAG=$PREVIOUS_TAG" >> .env
          fi
          
          echo "Deploying version ${{ github.sha }}"
          docker-compose pull
          docker-compose up -d
          sleep 3
    
    - name: Health check
      id: health_check
      env:
        VPS_HOST: ${{ secrets.VPS_HOST }}
        HEALTH_CHECK_URL: ${{ secrets.VPS_HEALTH_CHECK_URL }}
      run: |
        # Set health check URL if not provided
        if [ -z "$HEALTH_CHECK_URL" ]; then
          # Try HTTPS first, fallback to HTTP on port 8080 (common backend port)
          HEALTH_CHECK_URL="https://${VPS_HOST}/api/v1/system/status"
          HTTP_FALLBACK_URL="http://${VPS_HOST}:8080/api/v1/system/status"
        else
          HTTP_FALLBACK_URL=$(echo "$HEALTH_CHECK_URL" | sed 's|^https://|http://|' | sed 's|/api/|:8080/api/|')
        fi
        MAX_RETRIES=12
        RETRY_DELAY=10
        RETRY_COUNT=0
        
        HEALTH_CHECK_START=$(date +%s)
        
        while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
          REQUEST_START=$(date +%s%N)
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 --connect-timeout 3 "$HEALTH_CHECK_URL" 2>&1 || echo "000")
          
          if [ "$HTTP_CODE" = "000" ]; then
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 --connect-timeout 3 "$HTTP_FALLBACK_URL" 2>&1 || echo "000")
            if [ "$HTTP_CODE" != "000" ]; then
              HEALTH_CHECK_URL="$HTTP_FALLBACK_URL"
            fi
          fi
          
          REQUEST_END=$(date +%s%N)
          REQUEST_DURATION=$(( (REQUEST_END - REQUEST_START) / 1000000 ))
          
          if [ "$RETRY_COUNT" -eq 0 ]; then
            echo "first_response_time_ms=$REQUEST_DURATION" >> $GITHUB_OUTPUT
          fi
          
          if [ "$HTTP_CODE" = "200" ]; then
            RESPONSE=$(curl -s --max-time 5 "$HEALTH_CHECK_URL" || echo "")
            if echo "$RESPONSE" | grep -q '"overall":"UP"'; then
              HEALTH_CHECK_END=$(date +%s)
              HEALTH_CHECK_DURATION=$((HEALTH_CHECK_END - HEALTH_CHECK_START))
              echo "health_check_duration=$HEALTH_CHECK_DURATION" >> $GITHUB_OUTPUT
              echo "✅ Health check passed"
              exit 0
            fi
          fi
          
          RETRY_COUNT=$((RETRY_COUNT + 1))
          if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
            sleep $RETRY_DELAY
            RETRY_DELAY=$((RETRY_DELAY + 5))
          fi
        done
        
        HEALTH_CHECK_DURATION=$(( $(date +%s) - HEALTH_CHECK_START ))
        echo "health_check_duration=$HEALTH_CHECK_DURATION" >> $GITHUB_OUTPUT
        echo "❌ Health check failed after $MAX_RETRIES attempts"
        exit 0
    
    - name: Rollback on failure
      id: rollback
      if: failure() && steps.health_check.outcome == 'failure'
      uses: appleboy/ssh-action@v1.2.4
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          # Get previous tag from file
          if [ -f /tmp/previous_tag.txt ]; then
            PREVIOUS_TAG=$(cat /tmp/previous_tag.txt)
          elif [ -f .env ]; then
            PREVIOUS_TAG=$(grep -oP 'PREVIOUS_TAG=\K.*' .env 2>/dev/null || echo "")
          else
            PREVIOUS_TAG=""
          fi
          
          if [ -z "$PREVIOUS_TAG" ] || [ "$PREVIOUS_TAG" = "" ]; then
            echo "❌ No previous version found. Cannot rollback."
            exit 1
          fi
          
          echo "Rolling back to version: $PREVIOUS_TAG"
          if [ -f .env ]; then
            if grep -q "^APP_TAG=" .env; then
              sed "s|^APP_TAG=.*|APP_TAG=$PREVIOUS_TAG|" .env > .env.tmp && mv .env.tmp .env
            else
              echo "APP_TAG=$PREVIOUS_TAG" >> .env
            fi
          fi
          
          docker-compose pull
          docker-compose up -d
          echo "✅ Rollback completed"
          
          sleep 10
          if [ -z "${{ secrets.VPS_HEALTH_CHECK_URL }}" ]; then
            HEALTH_URL="https://${{ secrets.VPS_HOST }}/api/v1/system/status"
          else
            HEALTH_URL="${{ secrets.VPS_HEALTH_CHECK_URL }}"
          fi
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$HEALTH_URL" || echo "000")
    
    - name: Collect deployment metrics
      id: metrics
      if: always()
      run: |
        DEPLOYMENT_END=$(date +%s)
        DEPLOYMENT_START="${{ steps.init.outputs.deployment_start }}"
        DEPLOYMENT_DURATION=$((DEPLOYMENT_END - DEPLOYMENT_START))
        
        HEALTH_CHECK_DURATION="${{ steps.health_check.outputs.health_check_duration }}"
        FIRST_RESPONSE_TIME="${{ steps.health_check.outputs.first_response_time_ms }}"
        HEALTH_CHECK_FAILED="${{ steps.health_check.outputs.health_check_failed }}"
        
        DEPLOYMENT_STATUS="${{ steps.health_check.outcome }}"
        # Check if rollback was triggered (only if step actually ran, not skipped)
        if [ "${{ steps.rollback.outcome }}" = "success" ] || [ "${{ steps.rollback.outcome }}" = "failure" ]; then
          ROLLBACK_TRIGGERED="true"
        else
          ROLLBACK_TRIGGERED="false"
        fi
        
        # Get previous version - we'll use the one stored during deployment
        PREVIOUS_VERSION="unknown"
        # Previous version is stored in the deploy step, we'll use a default for now
        
        # Create metrics directory
        mkdir -p metrics
        
        # Create deployment metrics JSON
        cat > metrics/deployment-metrics.json << EOF
        {
          "workflow_run": ${{ github.run_number }},
          "deployment_id": "${{ github.run_id }}",
          "commit": "${{ github.sha }}",
          "branch": "${{ github.ref_name }}",
          "actor": "${{ github.actor }}",
          "event": "${{ github.event_name }}",
          "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
          "deployment": {
            "start_time": "$DEPLOYMENT_START",
            "end_time": "$DEPLOYMENT_END",
            "duration_seconds": $DEPLOYMENT_DURATION,
            "status": "$DEPLOYMENT_STATUS",
            "version": "${{ github.sha }}",
            "previous_version": "$PREVIOUS_VERSION"
          },
          "health_check": {
            "duration_seconds": ${HEALTH_CHECK_DURATION:-0},
            "first_response_time_ms": ${FIRST_RESPONSE_TIME:-0},
            "failed": ${HEALTH_CHECK_FAILED:-false}
          },
          "rollback": {
            "triggered": ${ROLLBACK_TRIGGERED}
          }
        }
        EOF
        
        echo "Deployment metrics saved to metrics/deployment-metrics.json"
        
        # Create summary
        echo "## 🚀 Deployment Metrics" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Deployment Information" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Status:** $DEPLOYMENT_STATUS" >> $GITHUB_STEP_SUMMARY
        echo "- **Duration:** ${DEPLOYMENT_DURATION} seconds" >> $GITHUB_STEP_SUMMARY
        echo "- **Version:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Previous Version:** $PREVIOUS_VERSION" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ -n "$HEALTH_CHECK_DURATION" ] && [ "$HEALTH_CHECK_DURATION" != "0" ]; then
          echo "### Health Check Performance" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Health Check Duration:** ${HEALTH_CHECK_DURATION} seconds" >> $GITHUB_STEP_SUMMARY
          if [ -n "$FIRST_RESPONSE_TIME" ] && [ "$FIRST_RESPONSE_TIME" != "0" ]; then
            echo "- **First Response Time:** ${FIRST_RESPONSE_TIME} ms" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ "$ROLLBACK_TRIGGERED" = "true" ]; then
          echo "### Rollback Information" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Rollback Triggered:** Yes" >> $GITHUB_STEP_SUMMARY
          echo "- **Rolled back to:** $PREVIOUS_VERSION" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        fi
    
    - name: Upload deployment metrics
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: deployment-metrics
        path: metrics/
        retention-days: 90
    
    - name: Deployment notification
      if: always()
      run: |
        if [ "${{ steps.health_check.outcome }}" = "success" ]; then
          echo "✅ Deployment successful"
        else
          echo "❌ Deployment failed"
        fi