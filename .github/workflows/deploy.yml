name: Deploy to VPS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy (default: current branch)'
        required: false
        default: ''

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Initialize deployment tracking
      id: init
      run: |
        DEPLOYMENT_START=$(date +%s)
        echo "deployment_start=$DEPLOYMENT_START" >> $GITHUB_OUTPUT
    
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.branch || github.ref }}
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_PASS }}
        
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USER }}/kidsgptbackend:${{ github.sha }}
        
    - name: Get previous deployment version
      id: previous_version
      uses: appleboy/ssh-action@v1.2.4
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          DEPLOY_DIR="${DEPLOY_DIR:-/opt/kidsgptbackend}"
          if [ ! -d "$DEPLOY_DIR" ]; then
            DEPLOY_DIR="$HOME/kidsgptbackend"
          fi
          if [ ! -d "$DEPLOY_DIR" ]; then
            DEPLOY_DIR="."
          fi
          cd "$DEPLOY_DIR" || exit 1
          
          PREVIOUS_TAG=$(docker ps --filter "ancestor=${{ secrets.DOCKER_USER }}/kidsgptbackend" --format "{{.Image}}" | sed -n 's/.*kidsgptbackend:\(.*\)/\1/p' | head -1 || echo "")
          if [ -z "$PREVIOUS_TAG" ]; then
            PREVIOUS_TAG=$(docker ps --filter "name=app" --format "{{.Image}}" | sed -n 's/.*kidsgptbackend:\(.*\)/\1/p' | head -1 || echo "")
          fi
          if [ -z "$PREVIOUS_TAG" ] && [ -f .env ]; then
            PREVIOUS_TAG=$(grep '^APP_TAG=' .env 2>/dev/null | cut -d'=' -f2- || echo "")
          fi
          echo "$PREVIOUS_TAG" > /tmp/previous_tag.txt
          echo "PREVIOUS_TAG=$PREVIOUS_TAG"
    
    - name: Deploy to VPS
      id: deploy
      uses: appleboy/ssh-action@v1.2.4
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          DEPLOY_DIR="${DEPLOY_DIR:-/opt/kidsgptbackend}"
          if [ ! -d "$DEPLOY_DIR" ]; then
            DEPLOY_DIR="$HOME/kidsgptbackend"
          fi
          if [ ! -d "$DEPLOY_DIR" ]; then
            DEPLOY_DIR="."
          fi
          cd "$DEPLOY_DIR" || exit 1
          
          DB_URL_VALUE="${{ secrets.DB_URL }}"
          if [ -z "$DB_URL_VALUE" ]; then
            DB_URL_VALUE="jdbc:mysql://db:3306/kidsgptdb?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC"
          else
            DB_URL_VALUE=$(echo "$DB_URL_VALUE" | sed 's|localhost:3306|db:3306|')
          fi
          cat > .env << EOF
          DB_URL=${DB_URL_VALUE}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          MAIL_HOST=${{ secrets.MAIL_HOST }}
          MAIL_PORT=${{ secrets.MAIL_PORT }}
          MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM=${{ secrets.MAIL_FROM }}
          MAIL_ENABLED=${{ secrets.MAIL_ENABLED }}
          FRONTEND_URL=${{ secrets.FRONTEND_URL }}
          MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_USER=${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
          DOCKER_USER=${{ secrets.DOCKER_USER }}
          APP_TAG=${{ github.sha }}
          EOF
          
          if [ -f /tmp/previous_tag.txt ]; then
            PREVIOUS_TAG=$(cat /tmp/previous_tag.txt)
            echo "PREVIOUS_TAG=$PREVIOUS_TAG" >> .env
          fi
          
          docker pull ${{ secrets.DOCKER_USER }}/kidsgptbackend:${{ github.sha }}
          
          if [ -f docker-compose.yml ]; then
            APP_TAG=${{ github.sha }} docker compose -f docker-compose.yml up -d --force-recreate --no-deps app
          else
            COMPOSE_FILE=$(find . -name "docker-compose.yml" -type f 2>/dev/null | head -1)
            if [ -n "$COMPOSE_FILE" ]; then
              APP_TAG=${{ github.sha }} docker compose -f "$COMPOSE_FILE" up -d --force-recreate --no-deps app
            else
              echo "docker-compose.yml not found"
              exit 1
            fi
          fi
          
          sleep 30
          
          CONTAINER_STATUS=$(docker ps --filter "name=app" --format "{{.Status}}" | head -1)
          if [ -z "$CONTAINER_STATUS" ]; then
            echo "Container is not running"
            docker ps -a --filter "name=app"
            docker logs $(docker ps -a --filter "name=app" --format "{{.ID}}" | head -1) || true
            exit 1
          fi
          
          if echo "$CONTAINER_STATUS" | grep -q "Exited"; then
            echo "Container exited"
            docker logs $(docker ps -a --filter "name=app" --format "{{.ID}}" | head -1)
            exit 1
          fi
    
    - name: Health check
      id: health_check
      env:
        VPS_HOST: ${{ secrets.VPS_HOST }}
        HEALTH_CHECK_URL: ${{ secrets.VPS_HEALTH_CHECK_URL }}
      run: |
        if [ -z "$HEALTH_CHECK_URL" ]; then
          if echo "$VPS_HOST" | grep -qE '^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$'; then
            HEALTH_CHECK_URL="http://${VPS_HOST}:8080/api/v1/system/status"
          else
            HEALTH_CHECK_URL="https://${VPS_HOST}/api/v1/system/status"
            HTTP_FALLBACK_URL="http://${VPS_HOST}:8080/api/v1/system/status"
          fi
        else
          HTTP_FALLBACK_URL=$(echo "$HEALTH_CHECK_URL" | sed 's|^https://|http://|' | sed 's|/api/|:8080/api/|')
        fi
        MAX_RETRIES=12
        RETRY_DELAY=10
        RETRY_COUNT=0
        
        HEALTH_CHECK_START=$(date +%s)
        
        while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
          REQUEST_START=$(date +%s%N)
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 3 --connect-timeout 2 "$HEALTH_CHECK_URL" 2>&1 || echo "000")
          
          if [ "$HTTP_CODE" = "000" ] && [ -n "$HTTP_FALLBACK_URL" ]; then
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 3 --connect-timeout 2 "$HTTP_FALLBACK_URL" 2>&1 || echo "000")
            if [ "$HTTP_CODE" != "000" ]; then
              HEALTH_CHECK_URL="$HTTP_FALLBACK_URL"
            fi
          fi
          
          REQUEST_END=$(date +%s%N)
          REQUEST_DURATION=$(( (REQUEST_END - REQUEST_START) / 1000000 ))
          
          if [ "$RETRY_COUNT" -eq 0 ]; then
            echo "first_response_time_ms=$REQUEST_DURATION" >> $GITHUB_OUTPUT
          fi
          
          if [ "$HTTP_CODE" = "200" ]; then
            RESPONSE=$(curl -s --max-time 3 "$HEALTH_CHECK_URL" || echo "")
            if echo "$RESPONSE" | grep -q '"overall":"UP"'; then
              HEALTH_CHECK_END=$(date +%s)
              HEALTH_CHECK_DURATION=$((HEALTH_CHECK_END - HEALTH_CHECK_START))
              echo "health_check_duration=$HEALTH_CHECK_DURATION" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          
          RETRY_COUNT=$((RETRY_COUNT + 1))
          if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
            sleep $RETRY_DELAY
          fi
        done
        
        HEALTH_CHECK_DURATION=$(( $(date +%s) - HEALTH_CHECK_START ))
        echo "health_check_duration=$HEALTH_CHECK_DURATION" >> $GITHUB_OUTPUT
        echo "health_check_failed=true" >> $GITHUB_OUTPUT
        exit 1
    
    - name: Verify deployed version
      if: steps.health_check.outcome == 'success'
      uses: appleboy/ssh-action@v1.2.4
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          DEPLOY_DIR="${DEPLOY_DIR:-/opt/kidsgptbackend}"
          if [ ! -d "$DEPLOY_DIR" ]; then
            DEPLOY_DIR="$HOME/kidsgptbackend"
          fi
          if [ ! -d "$DEPLOY_DIR" ]; then
            DEPLOY_DIR="."
          fi
          cd "$DEPLOY_DIR" || exit 1
          
          EXPECTED_TAG="${{ github.sha }}"
          RUNNING_TAG=$(docker ps --filter "ancestor=${{ secrets.DOCKER_USER }}/kidsgptbackend" --format "{{.Image}}" | sed -n 's/.*kidsgptbackend:\(.*\)/\1/p' | head -1 || echo "")
          if [ -z "$RUNNING_TAG" ]; then
            RUNNING_TAG=$(docker ps --filter "name=app" --format "{{.Image}}" | sed -n 's/.*kidsgptbackend:\(.*\)/\1/p' | head -1 || echo "")
          fi
          if [ -z "$RUNNING_TAG" ] && [ -f .env ]; then
            RUNNING_TAG=$(grep '^APP_TAG=' .env 2>/dev/null | cut -d'=' -f2- || echo "")
          fi
          
          if [ "$RUNNING_TAG" != "$EXPECTED_TAG" ]; then
            exit 1
          fi
    
    - name: Rollback on failure
      id: rollback
      if: failure()
      uses: appleboy/ssh-action@v1.2.4
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          DEPLOY_DIR="${DEPLOY_DIR:-/opt/kidsgptbackend}"
          if [ ! -d "$DEPLOY_DIR" ]; then
            DEPLOY_DIR="$HOME/kidsgptbackend"
          fi
          if [ ! -d "$DEPLOY_DIR" ]; then
            DEPLOY_DIR="."
          fi
          cd "$DEPLOY_DIR" || exit 1
          
          if [ -f /tmp/previous_tag.txt ]; then
            PREVIOUS_TAG=$(cat /tmp/previous_tag.txt)
          elif [ -f .env ]; then
            PREVIOUS_TAG=$(grep '^PREVIOUS_TAG=' .env 2>/dev/null | cut -d'=' -f2- || echo "")
          else
            PREVIOUS_TAG=""
          fi
          
          if [ -z "$PREVIOUS_TAG" ]; then
            exit 1
          fi
          
          if [ -f .env ]; then
            if grep -q "^APP_TAG=" .env; then
              sed "s|^APP_TAG=.*|APP_TAG=$PREVIOUS_TAG|" .env > .env.tmp && mv .env.tmp .env
            else
              echo "APP_TAG=$PREVIOUS_TAG" >> .env
            fi
          fi
          
          if [ -f docker-compose.yml ]; then
            docker compose -f docker-compose.yml pull app
            APP_TAG=$PREVIOUS_TAG docker compose -f docker-compose.yml up -d --no-deps app
          else
            COMPOSE_FILE=$(find . -name "docker-compose.yml" -type f 2>/dev/null | head -1)
            if [ -n "$COMPOSE_FILE" ]; then
              docker compose -f "$COMPOSE_FILE" pull app
              APP_TAG=$PREVIOUS_TAG docker compose -f "$COMPOSE_FILE" up -d --no-deps app
            else
              exit 1
            fi
          fi
    
    - name: Collect deployment metrics
      id: metrics
      if: always()
      run: |
        DEPLOYMENT_END=$(date +%s)
        DEPLOYMENT_START="${{ steps.init.outputs.deployment_start }}"
        DEPLOYMENT_DURATION=$((DEPLOYMENT_END - DEPLOYMENT_START))
        HEALTH_CHECK_DURATION="${{ steps.health_check.outputs.health_check_duration }}"
        FIRST_RESPONSE_TIME="${{ steps.health_check.outputs.first_response_time_ms }}"
        HEALTH_CHECK_FAILED="${{ steps.health_check.outputs.health_check_failed }}"
        DEPLOYMENT_STATUS="${{ steps.health_check.outcome }}"
        if [ "${{ steps.rollback.outcome }}" = "success" ] || [ "${{ steps.rollback.outcome }}" = "failure" ]; then
          ROLLBACK_TRIGGERED="true"
        else
          ROLLBACK_TRIGGERED="false"
        fi
        PREVIOUS_VERSION="unknown"
        mkdir -p metrics
        cat > metrics/deployment-metrics.json << EOF
        {
          "workflow_run": ${{ github.run_number }},
          "deployment_id": "${{ github.run_id }}",
          "commit": "${{ github.sha }}",
          "branch": "${{ github.ref_name }}",
          "actor": "${{ github.actor }}",
          "event": "${{ github.event_name }}",
          "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
          "deployment": {
            "start_time": "$DEPLOYMENT_START",
            "end_time": "$DEPLOYMENT_END",
            "duration_seconds": $DEPLOYMENT_DURATION,
            "status": "$DEPLOYMENT_STATUS",
            "version": "${{ github.sha }}",
            "previous_version": "$PREVIOUS_VERSION"
          },
          "health_check": {
            "duration_seconds": ${HEALTH_CHECK_DURATION:-0},
            "first_response_time_ms": ${FIRST_RESPONSE_TIME:-0},
            "failed": ${HEALTH_CHECK_FAILED:-false}
          },
          "rollback": {
            "triggered": ${ROLLBACK_TRIGGERED}
          }
        }
        EOF
    
    - name: Upload deployment metrics
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: deployment-metrics
        path: metrics/
        retention-days: 90
    
    - name: Deployment notification
      if: always()
      run: |
        if [ "${{ steps.health_check.outcome }}" = "success" ] && [ "${{ steps.health_check.outputs.health_check_failed }}" != "true" ]; then
          echo "✅ Deployment successful"
        else
          echo "❌ Deployment failed"
        fi
