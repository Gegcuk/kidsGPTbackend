name: Continuous Integration

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: bestuser
          MYSQL_DATABASE: kidsgptdb
          MYSQL_USER: bestuser
          MYSQL_PASSWORD: bestuser
        ports: [ "3306:3306" ]
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/kidsgptdb?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      TEST_DB_USERNAME: bestuser
      TEST_DB_PASSWORD: bestuser

    steps:
      - uses: actions/checkout@v4

      - name: Wait for MySQL
        run: |
          until mysqladmin ping -h 127.0.0.1 -ubestuser -pbestuser --silent; do
            echo "Waiting for MySQL…"
            sleep 4
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Build & test
        run: ./mvnw --batch-mode clean verify

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          retention-days: 30

      - name: Generate coverage summary
        if: always()
        run: |
          if [ -f target/site/jacoco/index.html ]; then
            echo "## 📊 Code Coverage Report" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Coverage report generated. View details in the uploaded artifacts." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📁 Artifact: \`jacoco-coverage-report\`" >> $GITHUB_STEP_SUMMARY
          fi
