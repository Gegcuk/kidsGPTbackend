name: Continuous Integration

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

# Prevent concurrent runs on the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      build_duration: ${{ steps.build.outputs.build_duration }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Build (compile and package)
        id: build
        run: |
          START_TIME=$(date +%s)
          ./mvnw --batch-mode clean package -DskipTests
          END_TIME=$(date +%s)
          BUILD_DURATION=$((END_TIME - START_TIME))
          echo "build_duration=$BUILD_DURATION" >> $GITHUB_OUTPUT
          echo "Build completed in ${BUILD_DURATION} seconds"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            target/*.jar
            !target/*-sources.jar
            !target/*-javadoc.jar
          retention-days: 7

  test:
    runs-on: ubuntu-latest
    # Run in parallel with build for true parallelism (each does its own clean build)
    timeout-minutes: 20
    outputs:
      test_duration: ${{ steps.test.outputs.test_duration }}

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: bestuser
          MYSQL_DATABASE: kidsgptdb
          MYSQL_USER: bestuser
          MYSQL_PASSWORD: bestuser
        ports: [ "3306:3306" ]
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/kidsgptdb?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      TEST_DB_USERNAME: bestuser
      TEST_DB_PASSWORD: bestuser

    steps:
      - uses: actions/checkout@v4

      - name: Wait for MySQL
        run: |
          # Wait for MySQL container to be ready (health check handles most of this)
          for i in {1..30}; do
            if timeout 2 bash -c "cat < /dev/null > /dev/tcp/127.0.0.1/3306" 2>/dev/null; then
              echo "MySQL is ready"
              break
            fi
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Run tests
        id: test
        run: |
          START_TIME=$(date +%s)
          # Run clean verify (builds and tests in one go, independent of build job)
          ./mvnw --batch-mode clean verify
          TEST_EXIT_CODE=$?
          END_TIME=$(date +%s)
          TEST_DURATION=$((END_TIME - START_TIME))
          echo "test_duration=$TEST_DURATION" >> $GITHUB_OUTPUT
          echo "test_exit_code=$TEST_EXIT_CODE" >> $GITHUB_OUTPUT
          echo "Tests completed in ${TEST_DURATION} seconds"
          exit $TEST_EXIT_CODE

      - name: Publish test results
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Test Results
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Generate test summary
        if: always()
        run: |
          if [ -d target/surefire-reports ]; then
            echo "## 🧪 Test Results Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            TOTAL=$(find target/surefire-reports -name "*.xml" -exec grep -h "testsuite" {} \; | grep -o 'tests="[0-9]*"' | grep -o '[0-9]*' | awk '{sum+=$1} END {print sum}')
            FAILED=$(find target/surefire-reports -name "*.xml" -exec grep -h "testsuite" {} \; | grep -o 'failures="[0-9]*"' | grep -o '[0-9]*' | awk '{sum+=$1} END {print sum}')
            ERRORS=$(find target/surefire-reports -name "*.xml" -exec grep -h "testsuite" {} \; | grep -o 'errors="[0-9]*"' | grep -o '[0-9]*' | awk '{sum+=$1} END {print sum}')
            if [ -z "$TOTAL" ]; then TOTAL=0; fi
            if [ -z "$FAILED" ]; then FAILED=0; fi
            if [ -z "$ERRORS" ]; then ERRORS=0; fi
            PASSED=$((TOTAL - FAILED - ERRORS))
            echo "- **Total Tests:** $TOTAL" >> $GITHUB_STEP_SUMMARY
            echo "- **Passed:** $PASSED" >> $GITHUB_STEP_SUMMARY
            echo "- **Failed:** $FAILED" >> $GITHUB_STEP_SUMMARY
            echo "- **Errors:** $ERRORS" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📁 View detailed results in the Test Results section above." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          retention-days: 30

      - name: Generate coverage summary
        if: always()
        run: |
          if [ -f target/site/jacoco/index.html ]; then
            echo "## 📊 Code Coverage Report" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Coverage report generated. View details in the uploaded artifacts." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📁 Artifact: \`jacoco-coverage-report\`" >> $GITHUB_STEP_SUMMARY
          fi

  security-scan:
    runs-on: ubuntu-latest
    # Run in parallel with build/test, don't block on failure
    timeout-minutes: 30
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Compile (required for dependency analysis)
        run: ./mvnw --batch-mode clean compile -DskipTests

      - name: Run OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        continue-on-error: true
        timeout-minutes: 30
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "⚠️ Warning: NVD_API_KEY secret is not set. Scan will be slower without API key."
          else
            echo "✅ NVD_API_KEY is set (length: ${#NVD_API_KEY} characters)"
          fi
          
          echo "🔒 Running security scan..."
          # Pass API key as both environment variable and Maven property
          # Note: continue-on-error handles failures, so we don't need || exit 0
          ./mvnw --batch-mode org.owasp:dependency-check-maven:check \
            -Dnvd.api.key="$NVD_API_KEY" \
            -Ddependency-check.nvd.apiKey="$NVD_API_KEY"

      - name: Upload security scan report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-scan-report
          path: target/dependency-check-report.*
          retention-days: 30

      - name: Generate security scan summary
        if: always()
        run: |
          if [ -f target/dependency-check-report.html ]; then
            echo "## 🔒 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "OWASP Dependency-Check scan completed. View detailed report in artifacts." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📁 Artifact: \`security-scan-report\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ⚠️ Security Scan Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Security scan encountered issues. Check logs for details." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Note: Dependabot and CodeQL still provide security coverage." >> $GITHUB_STEP_SUMMARY
          fi

  metrics:
    runs-on: ubuntu-latest
    needs: [build, test, security-scan]
    if: always()
    
    steps:
      - name: Collect build metrics
        run: |
          echo "## 📈 CI/CD Metrics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Get job durations from previous jobs
          BUILD_STATUS="${{ needs.build.result }}"
          TEST_STATUS="${{ needs.test.result }}"
          SECURITY_STATUS="${{ needs.security-scan.result }}"
          
          # Get durations from job outputs
          BUILD_DURATION="${{ needs.build.outputs.build_duration }}"
          TEST_DURATION="${{ needs.test.outputs.test_duration }}"
          
          echo "### Build Metrics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Status:** $BUILD_STATUS" >> $GITHUB_STEP_SUMMARY
          if [ -n "$BUILD_DURATION" ] && [ "$BUILD_DURATION" != "" ]; then
            echo "- **Build Duration:** ${BUILD_DURATION} seconds" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- **Test Status:** $TEST_STATUS" >> $GITHUB_STEP_SUMMARY
          if [ -n "$TEST_DURATION" ] && [ "$TEST_DURATION" != "" ]; then
            echo "- **Test Duration:** ${TEST_DURATION} seconds" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- **Security Scan Status:** $SECURITY_STATUS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Calculate overall status
          if [ "$BUILD_STATUS" = "success" ] && [ "$TEST_STATUS" = "success" ]; then
            OVERALL_STATUS="✅ Success"
          else
            OVERALL_STATUS="❌ Failed"
          fi
          
          echo "- **Overall Status:** $OVERALL_STATUS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Get workflow run information
          echo "### Workflow Information" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Workflow Run:** ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Event:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Create metrics JSON file
          mkdir -p metrics
          # Use numeric defaults for durations (0 if not available)
          BUILD_DURATION_NUM=$([ -n "$BUILD_DURATION" ] && echo "$BUILD_DURATION" || echo "0")
          TEST_DURATION_NUM=$([ -n "$TEST_DURATION" ] && echo "$TEST_DURATION" || echo "0")
          
          cat > metrics/ci-metrics.json << EOF
          {
            "workflow_run": ${{ github.run_number }},
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "actor": "${{ github.actor }}",
            "event": "${{ github.event_name }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "build": {
              "status": "$BUILD_STATUS",
              "duration_seconds": $BUILD_DURATION_NUM
            },
            "test": {
              "status": "$TEST_STATUS",
              "duration_seconds": $TEST_DURATION_NUM
            },
            "security_scan": {
              "status": "$SECURITY_STATUS"
            },
            "overall_status": "$OVERALL_STATUS"
          }
          EOF
          
          echo "Metrics saved to metrics/ci-metrics.json"

      - name: Upload metrics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-metrics
          path: metrics/
          retention-days: 90
