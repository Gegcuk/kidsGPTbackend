name: Continuous Deployment (Legacy)

# NOTE: This workflow is legacy. Use deploy.yml instead for deployments with health checks and rollback.
# This workflow is kept for backward compatibility but should be disabled or removed.
# To disable: comment out the 'on:' section or set to workflow_dispatch only.

on:
  # Disabled - use deploy.yml instead
  workflow_dispatch:
    inputs:
      force:
        description: 'Force deployment (use deploy.yml instead)'
        required: true
        default: false
        type: boolean

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USER }}/kidsgptbackend

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Build & push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: SSH to VPS and redeploy
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            APP_TAG=${{ github.sha }} DOCKER_USER=${{ secrets.DOCKER_USER }} \
            bash /opt/kidsgptbackend/deploy.sh
