spring.application.name=kidsGPTbackend

# -------------------- MySQL connection (default / prod profile) --------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/kidsgptdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:bestuser}
spring.datasource.password=${DB_PASSWORD:bestuser}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------- JPA / Hibernate --------------------
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# -------------------- JWT Configuration --------------------
jwt.secret=${JWT_SECRET:dGVzdC1zZWNyZXQtZm9yLWp3dC10b2tlbi1nZW5lcmF0aW9uLWFuZC12ZXJpZmljYXRpb24=}
jwt.access-expiration-ms=43200000
jwt.refresh-expiration-ms=604800000
spring.config.import=optional:classpath:secret.properties,optional:file:.env[.properties]

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini

# -------------------- OpenAI Image Generation Configuration --------------------
spring.ai.openai.image.options.model=dall-e-3
spring.ai.openai.image.options.quality=standard
spring.ai.openai.image.options.size=1024x1024
spring.ai.openai.image.options.style=natural

# -------------------- Rate Limiting Configuration --------------------
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.auth.requests-per-minute=${AUTH_RATE_LIMIT:5}
app.rate-limit.chat.requests-per-minute=${CHAT_RATE_LIMIT:30}
app.rate-limit.image.requests-per-minute=${IMAGE_RATE_LIMIT:10}
app.rate-limit.general.requests-per-minute=${GENERAL_RATE_LIMIT:100}
app.rate-limit.register.requests-per-hour=${REGISTER_RATE_LIMIT:3}

# -------------------- Email Configuration --------------------
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Application Email Configuration
app.email.host=${MAIL_HOST}
app.email.port=${MAIL_PORT}
app.email.username=${MAIL_USERNAME}
app.email.password=${MAIL_PASSWORD}
app.email.from=${MAIL_FROM:${MAIL_USERNAME}}
app.email.frontend-url=${FRONTEND_URL}
app.email.enabled=${MAIL_ENABLED:true}

# -------------------- Consent Management Configuration --------------------
# Hashing & signatures
app.consent.hmac.secret-ref=${CONSENT_HMAC_SECRET:default-consent-hmac-secret-key}
app.hashing.argon2.memory-kib=${ARGON2_MEMORY_KIB:65536}
app.hashing.argon2.iterations=${ARGON2_ITERATIONS:3}
app.hashing.argon2.parallelism=${ARGON2_PARALLELISM:2}

# Verification flow
app.consent.verification.timeout-minutes=${VERIFICATION_TIMEOUT_MINUTES:30}
app.consent.verification.max-attempts=${VERIFICATION_MAX_ATTEMPTS:3}

# Retention fallback (used only if jurisdiction_rules.retention_years is NULL)
app.consent.default-retention-years=${DEFAULT_RETENTION_YEARS:7}

# Audit
app.consent.audit.enabled=${CONSENT_AUDIT_ENABLED:true}
