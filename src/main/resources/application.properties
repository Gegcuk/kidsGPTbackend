spring.application.name=kidsGPTbackend

# -------------------- MySQL connection (default / prod profile) --------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/kidsgptdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:bestuser}
spring.datasource.password=${DB_PASSWORD:bestuser}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------- JPA / Hibernate --------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# -------------------- JWT Configuration --------------------
jwt.secret=${JWT_SECRET:dGVzdC1zZWNyZXQtZm9yLWp3dC10b2tlbi1nZW5lcmF0aW9uLWFuZC12ZXJpZmljYXRpb24=}
jwt.access-expiration-ms=43200000
jwt.refresh-expiration-ms=604800000
spring.config.import=optional:classpath:secret.properties,optional:file:.env[.properties]

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini

# -------------------- Email Configuration --------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:test@example.com}
spring.mail.password=${MAIL_PASSWORD:testpassword}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# -------------------- Application Configuration --------------------
app.frontend.url=${FRONTEND_URL:http://localhost:3000}
