# ==================== Development Profile Configuration ====================
# This profile is for local development and provides verbose logging
# 
# Usage: mvn spring-boot:run -Dspring-boot.run.profiles=dev
#        or: java -jar target/kidsGPTbackend.jar --spring.profiles.active=dev

# -------------------- Application Logging --------------------
# Debug level for your application
logging.level.uk.gegc.kidsgptbackend=DEBUG

# -------------------- Web & MVC Logging --------------------
# Show HTTP requests and responses
logging.level.org.springframework.web=DEBUG

# Show detailed endpoint mappings and controller invocations
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE

# Show request/response bodies
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG

# -------------------- Security Logging --------------------
# Show authentication and authorization details
logging.level.org.springframework.security=DEBUG

# -------------------- Database Logging --------------------
# Show SQL queries
logging.level.org.hibernate.SQL=DEBUG

# Show SQL query parameters (optional, very verbose)
# logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Show JPA/Hibernate transactions
# logging.level.org.springframework.orm.jpa=DEBUG
# logging.level.org.springframework.transaction=DEBUG

# -------------------- Exception Handler Logging --------------------
# Show detailed exception handler info
logging.level.uk.gegc.kidsgptbackend.shared.exception.advice.GlobalExceptionHandler=DEBUG

# -------------------- Console Pattern --------------------
# Prettier console output for development
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %highlight(%-5level) %magenta([%thread]) %cyan(%logger{36}) - %msg%n

# -------------------- Log File (Optional) --------------------
# Uncomment to write logs to file
# logging.file.name=logs/kidsgpt-dev.log
# logging.file.max-size=10MB
# logging.file.max-history=30

# -------------------- Dev-specific Settings --------------------
# Show configuration properties on startup
# logging.level.org.springframework.boot.context.config=DEBUG

# Show bean creation and dependency injection
# logging.level.org.springframework.beans.factory=DEBUG

# -------------------- Subscriptions (Dev/Mock) --------------------
# Enable mock Google Play client for local testing (no external calls)
app.subscriptions.mock-google-play=true
# Default mock product ID and expiry window for local tests
app.subscriptions.mock-product-id=test_monthly
app.subscriptions.mock-expiry-days=30
