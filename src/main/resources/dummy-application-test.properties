# Overrides used when @ActiveProfiles("test") is active
# Point at the same schema the CI container creates so no extra grants are needed
spring.datasource.url=${TEST_DB_URL:jdbc:mysql://localhost:3306/kidsgptdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${TEST_DB_USERNAME:bestuser}
spring.datasource.password=${TEST_DB_PASSWORD:bestuser}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
# Email config for tests
MAIL_HOST=smtp.test.com
MAIL_PORT=587
MAIL_USERNAME=test@example.com
MAIL_PASSWORD=testpassword
MAIL_FROM=test@example.com
MAIL_ENABLED=false

# Frontend URL for tests
FRONTEND_URL=http://localhost:3000

# JWT secret for tests (must be at least 32 chars)
JWT_SECRET=12345678901234567890123456789012