# Test database configuration (H2 in-memory)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA configuration for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.connection.isolation=READ_COMMITTED
spring.jpa.properties.hibernate.optimistic_locking=false
spring.jpa.properties.hibernate.jdbc.batch_size=0

# JWT configuration for tests (must be at least 32 chars)
jwt.secret=dGVzdC1zZWNyZXQtZm9yLWp3dC10b2tlbi1nZW5lcmF0aW9uLWFuZC12ZXJpZmljYXRpb24
jwt.access-expiration-ms=3600000
jwt.refresh-expiration-ms=86400000

# Rate limiting configuration for tests - DISABLED to prevent test failures
app.rate-limit.enabled=false
app.rate-limit.auth.requests-per-minute=1000
app.rate-limit.chat.requests-per-minute=1000
app.rate-limit.image.requests-per-minute=1000
app.rate-limit.general.requests-per-minute=1000
app.rate-limit.register.requests-per-hour=1000

# Email configuration for tests (using fake SMTP)
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test@example.com
spring.mail.password=testpassword
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Application email config for tests
app.email.host=localhost
app.email.port=3025
app.email.username=test@example.com
app.email.password=testpassword
app.email.from=test@example.com
app.email.frontend-url=http://localhost:3000
app.email.enabled=false

# Application configuration for tests
app.frontend.url=http://localhost:3000

# OpenAI configuration for tests (using mock/fake keys)
spring.ai.openai.api-key=test-api-key
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.image.options.model=dall-e-3
spring.ai.openai.image.options.quality=standard
spring.ai.openai.image.options.size=1024x1024
spring.ai.openai.image.options.style=natural

# Disable scheduling for tests
spring.task.scheduling.pool.size=1

# Consent service configuration for tests
app.consent.hmac.secret-ref=test-hmac-secret-key-for-consent-signing
app.consent.default-retention-years=7

# Verification configuration for tests
verification.pepper=dGVzdC12ZXJpZmljYXRpb24tcGVwcGVyLWtleS1mb3ItdGVzdHM=
verification.ttl-minutes=30

# Google Play configuration for tests (using empty values to enable mock mode)
google.play.service-account-key=
google.play.package-name=com.example.test
google.play.application-name=KidsGPT-Test