# Test database configuration
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# JPA configuration for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# Disable JPA open session in view for tests
spring.jpa.open-in-view=false
# JWT configuration for tests
jwt.secret=dGVzdC1zZWNyZXQtZm9yLWp3dC10b2tlbi1nZW5lcmF0aW9uLWFuZC12ZXJpZmljYXRpb24=
jwt.access-expiration-ms=3600000
jwt.refresh-expiration-ms=86400000
# Email configuration for tests (using fake SMTP)
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test@example.com
spring.mail.password=testpassword
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
# Application configuration for tests
app.frontend.url=http://localhost:3000
# Disable scheduling for tests
spring.task.scheduling.pool.size=1 