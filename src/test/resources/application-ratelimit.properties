# Rate limiting configuration for testing
app.rate-limit.enabled=true

# Rate limit settings for testing
app.rate-limit.auth.requests-per-minute=5
app.rate-limit.chat.requests-per-minute=30
app.rate-limit.image.requests-per-minute=10
app.rate-limit.general.requests-per-minute=100
app.rate-limit.register.requests-per-hour=3

# Enable debug logging for rate limiting
logging.level.uk.gegc.kidsgptbackend.security.RateLimitFilter=DEBUG
logging.level.uk.gegc.kidsgptbackend.security.RateLimitService=DEBUG

# Test database configuration (H2 in-memory)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA configuration for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# JWT configuration for tests (must be at least 32 chars)
jwt.secret=dGVzdC1zZWNyZXQtZm9yLWp3dC10b2tlbi1nZW5lcmF0aW9uLWFuZC12ZXJpZmljYXRpb24
jwt.access-expiration-ms=3600000
jwt.refresh-expiration-ms=86400000

# OpenAI configuration for tests
spring.ai.openai.api-key=sk-test-key-for-testing-purposes-only
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.moderation.options.model=omni-moderation-latest

# Email configuration for tests (using fake SMTP)
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test@example.com
spring.mail.password=testpassword
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Application email config for tests
app.email.host=localhost
app.email.port=3025
app.email.username=test@example.com
app.email.password=testpassword
app.email.from=test@example.com
app.email.frontend-url=http://localhost:3000
app.email.enabled=false

# Application configuration for tests
app.frontend.url=http://localhost:3000

# Disable scheduling for tests
spring.task.scheduling.pool.size=1 